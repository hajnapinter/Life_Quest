name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Python tests (no real Supabase or AI keys needed)
        run: uv run --frozen pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Google sign-in (PKCE) tests
        run: node --test tests/oauth.test.cjs

      - name: Check dependencies for known vulnerabilities
        run: uvx pip-audit -r requirements.txt --progress-spinner off
